# Tests on every pull request and push (backend against PostgreSQL + pgvector; frontend type-check and build).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env: { POSTGRES_USER: dm_owner, POSTGRES_PASSWORD: dm_owner, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dm_owner" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dm_app:dm_app@localhost:5432/dm_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://dm_owner:dm_owner@localhost:5432/dm_test
      TEST_DB_NAME: dm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: App role (not a superuser, so row-level security is tested for real)
        run: psql postgresql://dm_owner:dm_owner@localhost:5432/postgres -c "CREATE ROLE dm_app LOGIN PASSWORD 'dm_app'"
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: frontend
